name: HabibOil Daily AI Marketing Autopilot

on:
  schedule:
    # Runs every day at 05:00 UTC (10:00 AM PKT)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      custom_theme:
        description: 'Optional custom scene/theme for today (leave blank for automatic rotation)'
        required: false
        default: ''
      custom_bottle_filename:
        description: 'Optional bottle filename in assets/bottles/ (e.g., 1 liter Habiboil Mustard oil.png)'
        required: false
        default: ''
      use_influencer:
        description: 'Include influencer photo from assets/influenser/? (auto / true / false)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate AI Bottle Photo, Urdu SEO Caption, First Comment & Publish to Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: '61578353751886'
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CUSTOM_THEME: ${{ github.event.inputs.custom_theme }}
          CUSTOM_BOTTLE_FILENAME: ${{ github.event.inputs.custom_bottle_filename }}
          USE_INFLUENCER: ${{ github.event.inputs.use_influencer }}
        run: python main.py

      - name: Commit Generated Images & Captions to Repository
        run: |
          git config user.name "HabibOil AI Bot"
          git config user.email "bot@habiboil.store"
          git add generated/
          git commit -m "chore: daily HabibOil AI marketing post for $(date -I)" || echo "No new changes to commit"
          git push

      - name: Optional Publish to Google Business Profile
        env:
          GBP_WEBHOOK_URL: ${{ secrets.GBP_WEBHOOK_URL }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: '2767179596888125758'
        run: python publish_gbp.py
